name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoauto
          POSTGRES_PASSWORD: autoauto
          POSTGRES_DB: autoauto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://autoauto:autoauto@localhost:5432/autoauto_test' || '' }}
