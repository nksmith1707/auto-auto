<title>Auto-Auto Partner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: phone-width, map-first driver app. Dark by design: used in vehicles, at night, in sun glare with high contrast. */
:root{
  --bg:#060C1B; --panel:#0C1630; --panel2:#132245; --line:#22345E; --ink:#EEF2FF; --muted:#8E9CC2;
  --brand:#3D6BFF; --brand-deep:#1543D6; --brand-soft:#16295A; --money:#F5B83D; --money-soft:#3A2C0C;
  --ok:#2FD07A; --ok-soft:#0E3323; --bad:#FF5A62; --bad-soft:#3A1219;
  --map-land:#0D1A35; --map-road:#1C2E58; --map-road2:#25397000; --map-water:#0B2A5E; --map-park:#10301F;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--line)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* Buttons */
.btn{border:0;border-radius:14px;padding:15px 16px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.02em;background:var(--panel2);color:var(--ink);width:100%}
.btn.primary{background:var(--brand);color:#fff}
.btn.money{background:var(--money);color:#241800}
.btn.okb{background:var(--ok);color:#03200F}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:19px;font-size:19px}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:800;padding:6px 0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;position:relative;flex:none}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:#9DB6FF}.chip.money{background:var(--money-soft);color:var(--money)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{resize:vertical;min-height:80px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.err{color:var(--bad);font-size:13px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 6px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:#fff}
.tabs{display:flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-radius:9px;font-weight:800;color:var(--muted);font-size:13px}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.switch{width:46px;height:27px;border-radius:14px;background:var(--line);border:0;position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:22px}

/* Splash + login */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 70% at 50% 35%,#1A3A9E 0%,#0A1638 55%,var(--bg) 100%);text-align:center}
.wm{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:.06em;text-transform:uppercase}
.pbadge{font-family:var(--display);font-weight:800;letter-spacing:.32em;font-size:13px;color:var(--money);border:1.5px solid var(--money);padding:6px 10px 6px 14px;border-radius:6px}
.tagline{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.loadbar{width:150px;height:4px;border-radius:4px;background:#ffffff1f;overflow:hidden;margin-top:16px}
.loadbar i{display:block;height:100%;width:0;background:var(--money);animation:ld 1.8s ease forwards}
@keyframes ld{to{width:100%}}
.login{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:36px 24px;background:linear-gradient(180deg,#0F2161 0%,var(--bg) 42%)}
.login h1{font-family:var(--display);font-size:32px;line-height:1.05}
.login .hero{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.perks div{background:#ffffff0d;border:1px solid #ffffff14;border-radius:12px;padding:10px;font-size:12px;font-weight:700;color:var(--muted)}
.perks b{display:block;color:var(--ink);font-family:var(--display);font-size:18px}

/* Top + map */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:4}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--money);background:linear-gradient(135deg,#0E7490,#0B4F64);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;flex:none}
.earnpill{border:0;background:#060C1BE6;border:1px solid var(--line);border-radius:30px;padding:8px 18px;display:flex;flex-direction:column;align-items:center;line-height:1.1;backdrop-filter:blur(6px)}
.earnpill small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.earnpill b{font-family:var(--display);font-size:22px;color:var(--money);font-variant-numeric:tabular-nums}
.mapwrap{position:relative;height:min(52vh,430px);min-height:330px;overflow:hidden;background:var(--map-land)}
.mapwrap svg{display:block;width:100%;height:100%}
.searching{position:absolute;left:12px;top:72px;background:#060C1BE6;border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap;z-index:3}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #2FD07A99;animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px #2FD07A00}100%{box-shadow:0 0 0 0 #2FD07A00}}
.go{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.06em;box-shadow:0 0 0 7px #3D6BFF40,0 10px 30px #0008;z-index:3}
.go::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #3D6BFF;animation:gr 2.2s infinite;opacity:0}
@keyframes gr{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.go.on{background:var(--bad);width:70px;height:70px;font-size:16px;box-shadow:0 0 0 6px #FF5A6233,0 10px 30px #0008}
.go.on::before{display:none}
.mapcount{position:absolute;right:12px;top:72px;z-index:3;background:#060C1BE6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.pulse,.go::before,.loadbar i{animation:none}.loadbar i{width:100%}}

/* Panel + cards */
.panel{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:2;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.statusline b{font-family:var(--display);font-size:20px}
.statusline .dot{width:11px;height:11px;border-radius:50%;background:var(--muted)}
.statusline .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.statusline .muted{width:100%;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h3{font-family:var(--display);font-size:16px;letter-spacing:.01em}
.active-card{background:linear-gradient(140deg,#1A3FC4,#0E2470);border-color:#3D6BFF}
.active-card .label{color:#B7C8FF}
.quest .bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.quest .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--money),#FFD98A)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.stats span{font-size:10.5px;color:var(--muted);font-weight:700}
.alert{display:flex;gap:12px;align-items:center;background:var(--money-soft);border:1px solid #6B5212;border-radius:16px;padding:12px;width:100%;text-align:left}
.alert.bad{background:var(--bad-soft);border-color:#6E2530}
.alert svg{flex:none;color:var(--money)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:62px 14px 1fr auto;gap:10px;align-items:start;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:78px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl time{font-size:12px;font-weight:800;color:var(--muted);text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.tl .nd{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);background:var(--bg);margin-top:2px;position:relative;z-index:1}
.tl li.done .nd{background:var(--ok);border-color:var(--ok)}
.tl li.next .nd{border-color:var(--brand);background:var(--brand)}
.tl b{display:block;font-size:14px}.tl span{font-size:12px;color:var(--muted)}
.tl em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;color:var(--money);font-size:14px}

/* Nav */
.nav{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);background:#060C1BF2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;backdrop-filter:blur(8px)}
.nav button{border:0;background:none;color:var(--muted);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;position:relative}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--money)}
.nav .badge{top:4px;right:calc(50% - 20px)}

/* Headers for sub screens */
.hdr{display:flex;align-items:center;gap:10px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.hdr h1{font-family:var(--display);font-size:22px;flex:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.page{display:flex;flex-direction:column;gap:14px;padding-block:4px 24px}

/* Job board */
.jcard{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;width:100%;text-align:left}
.jcard:hover{border-color:var(--brand)}
.jcard .when{text-align:center;background:var(--panel2);border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.jcard .when span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.jcard .when b{font-family:var(--display);font-size:20px;line-height:1.1}
.jcard .when small{font-size:10.5px;font-weight:700;color:var(--muted)}
.jcard .mid{min-width:0;display:flex;flex-direction:column;gap:4px}
.jcard .mid b{font-size:15px}
.jcard .mid .muted{font-size:12px}
.jcard .pay{text-align:right;font-family:var(--display);font-weight:800;font-size:20px;color:var(--money);font-variant-numeric:tabular-nums}
.jcard .pay small{display:block;font-family:var(--body);font-size:10.5px;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.dayhead{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-top:6px}
.outside{border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}

/* Detail */
.payhero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.payhero b{font-family:var(--display);font-size:44px;color:var(--money);line-height:1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px}
.kv span{color:var(--muted);font-weight:600}
.kv b{font-weight:700;min-width:0}
.minimap{border-radius:16px;overflow:hidden;border:1px solid var(--line);height:190px}
.minimap svg{display:block;width:100%;height:100%}
.note{background:var(--panel2);border-radius:14px;padding:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;color:var(--brand);margin-top:1px}

/* Active job */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:800;color:var(--muted);text-align:center}
.steps i{height:5px;border-radius:3px;background:var(--line)}
.steps li.done i{background:var(--ok)}.steps li.now i{background:var(--money)}.steps li.now{color:var(--ink)}
.eta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eta b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.addr{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel2);border-radius:14px;padding:12px}
.addr b{font-size:16px}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;border:1.5px dashed var(--line);border-radius:12px;background:var(--panel);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px;cursor:pointer;overflow:hidden}
.slot.filled{border-style:solid;border-color:var(--ok);padding:0}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:#000A;color:#fff;font-size:9.5px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ck{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#03200F;display:grid;place-items:center;font-size:11px;font-weight:900}
.slot .ck.dm{background:var(--bad);color:#fff}
.slot svg{color:var(--brand)}
.progress{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}
.check{display:flex;gap:12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px;width:100%;text-align:left}
.check .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:900}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.check[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:#03200F}
.check .grow{flex:1;min-width:0}
.addon{border-radius:14px;padding:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.receipt{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.receipt div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.receipt span:first-child{color:var(--muted)}
.receipt .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:800;font-size:16px}
.receipt .tot span:first-child{color:var(--ink)}
.receipt .tot span:last-child{color:var(--money);font-family:var(--display);font-size:22px}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{border:0;background:none;font-size:38px;color:var(--line);padding:0 2px;line-height:1}
.stars button.on{color:var(--money)}

/* Earnings */
.earnhero{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;padding-top:6px}
.earnhero small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.earnhero b{font-family:var(--display);font-size:50px;color:var(--money);font-variant-numeric:tabular-nums;line-height:1.05}
.chart svg{display:block;width:100%;height:auto}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.trio b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.trio span{font-size:11px;color:var(--muted);font-weight:700}
.cash{background:linear-gradient(135deg,#2B2108,#14100A);border-color:#6B5212}
.cash b.big{font-family:var(--display);font-size:32px;color:var(--money);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .r{font-weight:800;font-variant-numeric:tabular-nums}

/* Inbox */
.msg{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.msg .av{width:42px;height:42px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;flex:none;color:#9DB6FF}
.msg .grow{flex:1;min-width:0}
.msg b{display:block}.msg p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.msg time{font-size:11px;color:var(--muted);flex:none}
.msg.unread b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-left:6px;vertical-align:2px}

/* Account */
.prof{display:flex;gap:14px;align-items:center}
.prof .avatar{width:68px;height:68px;font-size:24px}
.prof h2{font-family:var(--display);font-size:24px}
.menu{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:15px 14px;text-align:left;border-bottom:1px solid var(--line);font-weight:700}
.menu button:last-child{border-bottom:0}
.menu .grow{flex:1}
.menu svg{color:var(--muted);flex:none}
.svcrow{display:grid;grid-template-columns:1fr 92px auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.svcrow .input{padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.doc{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.doc .grow{flex:1;min-width:0}
.dist{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.dist .b{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.dist .b i{display:block;height:100%;background:var(--money)}
.rv{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.rv p{margin:0;font-size:14px}
.slider{width:100%;accent-color:var(--money)}
.daygrid{display:flex;flex-direction:column;gap:8px}

 {id:"ica",t:"Independent Contractor Agreement",v:"0.1",p:[
  ["Who we are","Auto-Auto, Inc. runs a marketplace platform that connects vehicle owners with independent service providers. You are a marketplace contractor, not an employee, agent, or partner of Auto-Auto. This agreement is intended to meet Tennessee's marketplace contractor law (Tenn. Code Ann. § 50-8-101 et seq.)."],
  ["You run your business","You decide whether and when to log in, which jobs to accept or decline, your service area, and your hours. Auto-Auto does not set hours you must be available."],

 {id:"pay",t:"Payments, Fees & Cancellations",v:"0.1",p:[
