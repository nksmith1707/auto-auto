<title>Auto-Auto App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column, centered on desktop, edge-to-edge on phones */
:root{
  --brand:#1550E6; --brand-deep:#0A2A7A; --brand-soft:#E6EEFF; --sky:#BFD6FF;
  --bg:#EEF2F9; --surface:#FFFFFF; --ink:#0E1A33; --muted:#5B6782; --line:#D5DCEA;
  --ok:#12A150; --warn:#E8A317; --bad:#D9363E; --map-land:#E9EEF6; --map-road:#FFFFFF; --map-park:#D3EBD9; --map-water:#C9DCF7;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#4B7BFF; --brand-deep:#0B1C4A; --brand-soft:#16264F; --sky:#20366E;
  --bg:#070D1C; --surface:#101A31; --ink:#E8EEFC; --muted:#93A0BE; --line:#24324F;
  --map-land:#152341; --map-road:#22355E; --map-park:#173A2D; --map-water:#13305E; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#4B7BFF; --brand-deep:#0B1C4A; --brand-soft:#16264F; --sky:#20366E;
  --bg:#070D1C; --surface:#101A31; --ink:#E8EEFC; --muted:#93A0BE; --line:#24324F;
  --map-land:#152341; --map-road:#22355E; --map-park:#173A2D; --map-water:#13305E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100%;background:var(--surface);position:relative;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Splash */
#splash{background:linear-gradient(180deg,var(--sky),var(--brand-soft));align-items:center;justify-content:center;gap:14px;text-align:center;min-height:100vh}
.wordmark{font-family:var(--display);font-weight:800;letter-spacing:.06em;color:var(--brand-deep);font-size:40px;text-transform:uppercase}
.tag{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-deep);font-size:13px;border-top:2px solid var(--brand-deep);padding-top:6px}
.engine{color:var(--brand-deep)}
.splash-bar{width:140px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:18px}
.splash-bar i{display:block;height:100%;width:0;background:var(--brand);animation:load 1.8s ease forwards}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){.splash-bar i{animation:none;width:100%}}

/* Auth */
.auth{padding-block:40px 24px;gap:18px}
.auth h1{font-family:var(--display);font-size:28px;margin:0;text-wrap:balance}
.tabs{display:flex;background:var(--brand-soft);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;padding:10px 8px;min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.input:focus{border-color:var(--brand);outline:none}
.btn{border:0;border-radius:14px;padding:15px;font-weight:800;font-family:var(--display);letter-spacing:.04em;font-size:16px;background:var(--brand);color:#fff}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* Info page */
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:14px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--brand-deep);position:relative}
:root[data-theme="dark"] .iconbtn{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .iconbtn{color:var(--ink)}}
.iconbtn:hover{background:var(--brand-soft)}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.page-title{font-family:var(--display);font-size:30px;font-weight:800;text-align:center;margin:4px 0 6px}
section.block{padding-block:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
section.block h2{font-size:17px;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.share{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.share.private{background:transparent;color:var(--muted);border:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.vcard{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vcard-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.photo-drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--brand);border-radius:12px;padding:10px;background:var(--brand-soft);cursor:pointer}
.photo-drop img,.photo-drop .ph{width:76px;height:52px;border-radius:8px;object-fit:cover;background:var(--surface);display:grid;place-items:center;flex:none}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:800;padding:6px 0;display:flex;align-items:center;gap:6px}
.sticky-cta{position:sticky;bottom:0;background:var(--brand);color:#fff;border:0;width:100%;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.05em}

/* Dashboard */
.dash-top{display:flex;align-items:center;gap:6px;padding-block:10px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:5}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:22px;padding:9px 14px;min-width:0}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.brandline{text-align:center;padding-block:4px 10px}
.brandline b{font-family:var(--display);font-size:24px;color:var(--brand);letter-spacing:.02em;display:block}
.brandline span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.vehicle{border-radius:20px;background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;padding:14px;display:flex;flex-direction:column;gap:12px}
.vehicle-row{display:flex;gap:12px;align-items:center}
.vehicle-img{width:46%;aspect-ratio:4/3;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.12);max-width:100%;flex:none}
.vehicle h3{margin:0;font-family:var(--display);font-size:22px;line-height:1.05}
.vehicle .yr{font-size:13px;opacity:.8;font-weight:700}
.vehicle .meta{font-size:12px;opacity:.85;margin-top:6px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.oil{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.oil-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.oil-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.oil-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3EE38A,#12A150)}
.oil-bar i.warn{background:linear-gradient(90deg,#FFD46B,#E8A317)}
.oil-bar i.bad{background:linear-gradient(90deg,#FF8A8A,#D9363E)}
.vtabs{display:flex;gap:6px;overflow-x:auto}
.vtabs button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.vtabs button[aria-pressed="true"]{background:#fff;color:var(--brand-deep)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding-block:18px 8px}
.sec-h h2{margin:0;font-family:var(--display);font-size:20px}
.pill-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.switch{width:42px;height:24px;border-radius:12px;background:var(--line);border:0;position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{left:21px}
.map{border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.partner{margin-top:10px;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.partner .logo{width:54px;height:54px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);flex:none;font-family:var(--display);font-weight:800;font-size:18px}
.partner .info{flex:1;min-width:0}
.partner .avail{font-size:11px;font-weight:800;color:var(--ok);display:flex;align-items:center;gap:5px}
.partner .avail::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.partner .name{font-weight:800;font-size:16px}
.stars{color:var(--warn);font-size:13px;letter-spacing:1px}
.stars small{color:var(--muted);letter-spacing:0;font-weight:600;margin-left:4px}
.small-btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;font-size:12px;white-space:nowrap}
.partners-list{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.dock{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--brand);margin-top:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.dock button{border:0;background:none;color:#fff;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;border-right:1px solid rgba(255,255,255,.18)}
.dock button:last-child{border-right:0}
.dock button:hover{background:rgba(255,255,255,.1)}
.spacer{height:20px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,12,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:430px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet h3{margin:0;font-family:var(--display);font-size:22px}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(5,12,30,.5)}
.drawer nav{background:var(--surface);width:78%;max-width:320px;height:100%;padding-block:calc(20px + env(safe-area-inset-top,0px)) 20px;display:flex;flex-direction:column;gap:4px}
.drawer nav button{text-align:left;border:0;background:none;padding:13px 10px;border-radius:10px;font-weight:700;display:flex;gap:12px;align-items:center}
.drawer nav button:hover{background:var(--brand-soft)}
.msg{display:flex;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.msg .av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none}
.msg .t{font-weight:800}.msg .p{font-size:13px;color:var(--muted)}
.msg.unread .t::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-left:6px}
.appt{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.appt .d{text-align:center;width:52px;flex:none;font-variant-numeric:tabular-nums}
.appt .d b{display:block;font-family:var(--display);font-size:24px;color:var(--brand)}
.appt .d span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.status{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-block;margin-top:4px}
.status.pending{background:#FFF3D6;color:#8A5A00}.status.ok{background:#DDF5E7;color:#0B6B35}
.offer{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:90%}
.demo{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-block:6px}

/* Flow screens */
.backbar{display:flex;align-items:center;gap:10px;padding-block:12px 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:5}
.backbar h1{margin:0;font-family:var(--display);font-size:20px;flex:1;text-align:center;padding-right:42px;text-wrap:balance}
.step{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);text-align:center}
.tab-flag{align-self:flex-end;background:var(--brand-deep);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;padding:6px 16px;border-radius:10px 10px 0 0;border:0}
.vpanel{border:1px solid var(--line);border-radius:18px 0 18px 18px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.vrow{display:flex;gap:12px;align-items:center}
.vthumb{width:44%;aspect-ratio:4/3;border-radius:12px;object-fit:cover;border:2px solid var(--brand-deep);max-width:100%;flex:none;background:var(--brand-soft)}
.vtitle .y{color:var(--brand);font-weight:700;font-size:13px}
.vtitle h3{margin:0;color:var(--brand);font-family:var(--display);font-size:21px;line-height:1.1;border-bottom:2px solid var(--line);padding-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--muted);font-weight:600}
.kv span:nth-child(even){font-weight:700}
.nextbar{display:flex;flex-direction:column;gap:5px}
.nextbar .row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--brand-deep);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .nextbar .row{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nextbar .row{color:var(--ink)}}
.nextbar .track{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.nextbar .track i{display:block;height:100%;background:linear-gradient(90deg,#3EE38A,#12A150)}
.nextbar .track i.warn{background:linear-gradient(90deg,#FFD46B,#E8A317)}
.nextbar .track i.bad{background:linear-gradient(90deg,#FF8A8A,#D9363E)}
.bigbtn{width:100%;border:0;background:var(--brand);color:#fff;font-family:var(--display);font-weight:800;font-size:19px;padding:22px;border-radius:0;letter-spacing:.02em}
.bigbtn.alt{background:var(--brand-deep)}
.bigbtn small{display:block;font-family:var(--body);font-weight:600;font-size:12px;opacity:.85;margin-top:2px}
.stats{background:var(--bg);padding-block:8px}
.stat{display:flex;justify-content:space-between;padding-block:12px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--brand),transparent 70%) 1;font-size:14px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:600}.stat b{font-weight:800}
.pick{background:var(--bg);padding-block:14px;display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--brand)}
.pick .sel{align-self:flex-end;border:0;background:var(--brand-deep);color:#fff;font-weight:800;font-family:var(--display);padding:9px 34px;border-radius:0 0 10px 10px;margin-bottom:-14px;font-size:15px}
.plist{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.prow:nth-child(odd){background:var(--bg)}
.av{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none;color:#fff}
.prow .info{flex:1;min-width:0}
.prow .name{font-weight:800}
.avail2{font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px}
.avail2.now{color:var(--ok)}.avail2.sched{color:var(--muted)}
.avail2::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.range{font-size:11px;color:var(--muted);font-weight:600}
.usebtn{border:0;background:var(--brand-deep);color:#fff;border-radius:20px;padding:7px 12px;font-weight:800;font-size:12px;white-space:nowrap}
.skipbar{position:sticky;bottom:0;width:100%;border:0;background:var(--brand);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-top:auto}
.skipbar small{display:block;font-family:var(--body);font-size:12px;font-weight:600;opacity:.85}
.phead{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:2px solid var(--brand);background:var(--bg)}
.phead .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.phead .chips span{background:var(--brand);color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}
.assist{align-self:center;background:var(--brand-deep);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;padding:8px 20px;border-radius:14px;margin:18px auto 10px;display:block;width:max-content;max-width:100%}
.svc{display:flex;align-items:center;gap:12px;padding-block:6px}
.seal{width:42px;height:42px;flex:none;border:0;background:none;padding:0;color:var(--line)}
.seal[aria-pressed="true"]{color:var(--brand)}
.svc .bar{flex:1;background:linear-gradient(90deg,var(--line),var(--bg));border-radius:2px;padding:12px 12px 6px;display:flex;flex-direction:column;min-width:0}
.svc .bar b{font-weight:700;font-size:15px}
.svc .bar .stars{align-self:flex-end;font-size:12px}
.notice{border:1px solid var(--line);background:var(--brand-soft);border-radius:14px;padding:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice svg{flex:none;color:var(--brand);margin-top:1px}
.summary{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.summary span{color:var(--muted);font-weight:600}.summary b{min-width:0}
.slider{width:100%;accent-color:var(--brand)}
.ring-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.ring-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.vflag{position:absolute;right:12px;top:12px;border:0;background:rgba(255,255,255,.95);color:var(--brand-deep);font-weight:800;font-size:12px;border-radius:8px;padding:5px 10px}
.vehicle{position:relative}
.bigcheck{width:84px;height:84px;margin:30px auto 6px;color:var(--ok)}
/* Thank-you + reviews */
.ty-hero{position:relative;width:max-content;margin:18px auto 0}
.ty-check{position:absolute;right:-12px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--ok);display:grid;place-items:center}
.ty-check svg{width:36px;height:36px}
.ty-title{font-family:var(--display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.mini-h{font-family:var(--display);font-size:17px;margin:0 0 10px}

function cancelQuote(a){const lines=[];const h=hrsUntil(a);const dep=a.deposit||0;
 if(a.status==="inprogress")return{blocked:true,lines,fee:0,dep,charge:0,refund:0,free:false};
 if(a.open)return{lines,fee:0,dep,charge:0,refund:dep,free:true};
 if(a.status==="enroute")lines.push(["Partner already on the way",FEE_ENROUTE]);
 else if(h<LATE_H)lines.push([`Late cancel (inside ${LATE_H} hrs)`,FEE_LATE]);
 if(a.partsOrdered)lines.push(["Parts already ordered for your job",a.partsCost||partsOf(a)]);
 const fee=lines.reduce((s,l)=>s+l[1],0);
 return{lines,fee,dep,charge:Math.max(0,fee-dep),refund:Math.max(0,dep-fee),free:fee===0}}
function reschedQuote(a){const used=a.resched||0;if(a.freeResched||isPlus())return{fee:0,why:a.freeResched?"Free because your partner was running late.":"Free with Plus."};
 if(hrsUntil(a)<RS_LATE_H)return{fee:FEE_LATE,why:`Changes inside ${RS_LATE_H} hours of the appointment count as a late change.`};
 if(used>=RS_FREE)return{fee:FEE_LATE,why:`You've used your ${RS_FREE} free reschedules for this booking.`};
 return{fee:0,why:`${RS_FREE-used} of ${RS_FREE} free reschedules left for this booking.`}}

const VIN_MAP={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};

const vinVal=c=>/\d/.test(c)?+c:VIN_MAP[c];
const vinCheck=v=>{const s=v.split("").reduce((t,c,i)=>t+vinVal(c)*VIN_W[i],0)%11;return s===10?"X":String(s)};
const fixVin=v=>v&&v.length===17?v.slice(0,8)+vinCheck(v)+v.slice(9):v;
const WMI={"1HG":"Honda","2HG":"Honda","5FN":"Honda","5FP":"Honda","19X":"Honda","JHM":"Honda","SHH":"Honda","1FA":"Ford","1FT":"Ford","1FM":"Ford","3FA":"Ford","1G1":"Chevrolet","1GC":"Chevrolet","1GN":"Chevrolet","3GN":"Chevrolet","1GT":"GMC","2T1":"Toyota","4T1":"Toyota","4T3":"Toyota","5TD":"Toyota","5TF":"Toyota","JTD":"Toyota","JTM":"Toyota","5YJ":"Tesla","7SA":"Tesla","1C4":"Jeep / Chrysler","1J4":"Jeep","1C6":"Ram","3C6":"Ram","3VW":"Volkswagen","WVW":"Volkswagen","WBA":"BMW","5UX":"BMW","WDD":"Mercedes-Benz","4JG":"Mercedes-Benz","JN1":"Nissan","1N4":"Nissan","5N1":"Nissan","KMH":"Hyundai","5NP":"Hyundai","KND":"Kia","5XY":"Kia","JF1":"Subaru","JF2":"Subaru","4S4":"Subaru","JM1":"Mazda","JM3":"Mazda","WAU":"Audi","YV1":"Volvo","1LN":"Lincoln","2LM":"Lincoln","5J6":"Honda","4S3":"Subaru"};
const YR="ABCDEFGHJKLMNPRSTVWXY123456789";
function vinDecode(raw){const v=(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(v.length!==17)return{ok:false,msg:"A VIN has 17 characters. Check the windshield or driver's door jamb."};
 if(/[IOQ]/.test(v))return{ok:false,msg:"VINs never use the letters I, O, or Q. Check for a 1 or 0."};
 const checkOK=vinCheck(v)===v[8];const yi=YR.indexOf(v[9]);let year=yi<0?null:1980+yi;if(year&&/[A-Z]/.test(v[6]))year+=30;
 return{ok:true,vin:v,checkOK,year,make:WMI[v.slice(0,3)]||null,msg:checkOK?"VIN checks out.":"Check digit doesn't match. One character may be wrong."}}
