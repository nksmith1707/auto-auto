 <div class="kv"><span>Tier</span><b>${p.tier}</b><span>Rating</span><b>${p.rating.toFixed(2)}</b><span>Cancel rate</span><b>${p.cancel}%</b><span>On time</span><b>${p.ontime}%</b><span>Coverage</span><b>${esc(p.cov)}</b><span>Documents</span><b>${esc(p.docs)}</b></div>
 ${below.length?`<div class="note warn">Below minimum: ${below.join(", ")}.</div>`:""}
 ${p.pauseWhy?`<div class="note bad"><b>Paused:</b> ${esc(p.pauseWhy)}</div>`:""}
 ${p.appeal&&p.status==="paused"?`<div class="card"><h2 style="font-size:15px">Appeal · ${ft(p.appeal.at)}</h2><p style="margin:0">“${esc(p.appeal.text)}”</p><span class="muted" style="font-size:12px">${p.appeal.files} files attached · decide within 5 business days</span><textarea class="input" id="ap-note" placeholder="Decision note sent to the partner (required)"></textarea><div class="btns"><button class="btn ok" id="ap-rein">Reinstate</button><button class="btn danger" id="ap-uph">Uphold the pause</button></div><div class="err" id="ap-err" hidden></div></div>`:""}
 <div class="card"><h2 style="font-size:15px">Actions</h2><div class="field"><label for="act-why">Reason category</label><select class="input" id="act-why"><option value="">Choose…</option><option>Metrics below minimum</option><option>Safety report</option><option>Damage claims pattern</option><option>Fraud or payment outside app</option><option>Expired insurance or license</option></select></div><textarea class="input" id="act-note" placeholder="What happened and the evidence (shown to the partner)"></textarea>
  <div class="btns"><button class="btn" id="act-warn">Send warning</button>${p.status==="paused"?`<button class="btn ok" id="act-rein">Reinstate</button>`:`<button class="btn" id="act-pause">Pause account</button>`}<button class="btn danger" id="act-deact">Deactivate</button></div><div class="err" id="act-err" hidden></div>
  <span class="muted" style="font-size:12px">The partner is told the reason and that they can appeal within 30 days. A different admin reviews appeals.</span></div>`,d=>{
  const need=()=>{const w=d.querySelector("#act-why").value,n=d.querySelector("#act-note").value.trim();if(!w||n.length<15){const e=d.querySelector("#act-err");e.textContent="Choose a reason and write what happened (shown to the partner).";e.hidden=false;return null}return w+": "+n};
  d.querySelector("#act-warn").onclick=()=>{const r=need();if(!r)return;p.status=p.status==="active"?"warned":p.status;audit(`${p.id} warned: ${r}`);toast("Warning sent");close();render()};
  const pa=d.querySelector("#act-pause");if(pa)pa.onclick=()=>{const r=need();if(!r)return;p.status="paused";p.pauseWhy=r;audit(`${p.id} paused`);toast("Account paused. Partner notified with appeal rights.");close();render()};
  const re=d.querySelector("#act-rein");if(re)re.onclick=()=>{p.status="active";p.pauseWhy="";p.appeal=null;audit(`${p.id} reinstated`);toast("Reinstated");close();render()};
  d.querySelector("#act-deact").onclick=e=>{const r=need();if(!r)return;const b=e.currentTarget;if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm deactivation";return}p.status="deactivated";p.pauseWhy=r;audit(`${p.id} deactivated`);toast("Deactivated. Partner notified with appeal rights.");close();render()};
  const ar=d.querySelector("#ap-rein"),au=d.querySelector("#ap-uph");const dec=k=>{const n=d.querySelector("#ap-note").value.trim();if(n.length<15){const e=d.querySelector("#ap-err");e.textContent="Write a decision note. The partner sees it.";e.hidden=false;return}if(k==="rein"){p.status="active";p.pauseWhy=""}p.appeal=null;audit(`${p.id} appeal ${k==="rein"?"granted":"denied"}: ${n}`);toast(k==="rein"?"Appeal granted. Partner reinstated.":"Appeal denied. Partner notified.");close();render()};if(ar)ar.onclick=()=>dec("rein");if(au)au.onclick=()=>dec("uph")})}

function claimDrawer(id){const c=CLAIMS.find(x=>x.id===id);const pp=/Partner Protection/.test(c.cov);
 drawer(`<div class="dh"><div><span class="muted num">${c.id} · filed ${ft(c.at)}</span><h2>${esc(c.what)} damage · ${money(c.est)}</h2></div><button class="x" data-x aria-label="Close">×</button></div>
 <div class="kv"><span>Job</span><b>${esc(c.job)}</b><span>Customer</span><b>${esc(c.cust)}</b><span>Partner</span><b>${esc(c.partner)}</b><span>Coverage</span><b>${esc(c.cov)}</b></div>
 <div class="note"><b>Customer:</b> ${esc(c.desc)}</div>
 <div class="photos"><figure><img src="${ph("CHECK-IN · before work","#E9ECF2",c.before)}" alt="Partner check-in photo"><figcaption>Partner check-in photo (before)</figcaption></figure><figure><img src="${ph("CUSTOMER · after","#E9ECF2",c.after)}" alt="Customer photo"><figcaption>Customer's photo (after)</figcaption></figure></div>
 ${c.note?`<div class="note warn"><b>Check-in note:</b> ${esc(c.note)}</div>`:""}
 ${c.resp?`<div class="note"><b>Partner response:</b> ${esc(c.resp)}</div>`:`<div class="note warn">Partner hasn't responded yet. Response window ends ${ft(c.at+2*D)}.</div><div class="demo">Demo: <button class="btn" id="cl-resp">Partner responds</button></div>`}
 ${c.status==="closed"?`<div class="note ok"><b>Decision:</b> ${esc(c.outcome)}</div>`:`<div class="card"><h2 style="font-size:15px">Decision</h2>
  <div class="field"><label>Outcome</label><select class="input" id="dc-o"><option value="">Choose…</option><option value="pay">Partner at fault · pay the customer</option><option value="good">Not proven · goodwill credit</option><option value="deny">Deny · damage was pre-existing or unrelated</option></select></div>
  <div class="field"><label for="dc-amt">Amount</label><input class="input num" id="dc-amt" inputmode="decimal" value="${c.est}"></div>
  <div class="field"><label>Paid by</label><select class="input" id="dc-src">${pp?`<option>Partner Protection (partner pays the $500 deductible from payouts, max 25% of each)</option>`:`<option>Partner's own insurer (Auto-Auto files on their policy)</option><option>Auto-Auto pays now, recovers from partner payouts (per Own Insurance Election)</option>`}</select></div>
  <textarea class="input" id="dc-note" placeholder="Explain the decision (sent to both sides)"></textarea><div class="err" id="dc-err" hidden></div>
  <button class="btn primary" id="dc-go" ${c.resp?"":"disabled"}>${c.resp?"Send decision":"Wait for the partner's response"}</button></div>`}`,d=>{
  const r=d.querySelector("#cl-resp");if(r)r.onclick=()=>{c.resp="The ding was there at check-in. It's in my photo 3 and I noted it.";c.status="review";claimDrawer(id);render()};
  const g=d.querySelector("#dc-go");if(g)g.onclick=()=>{const o=d.querySelector("#dc-o").value,n=d.querySelector("#dc-note").value.trim(),amt=+d.querySelector("#dc-amt").value,src=d.querySelector("#dc-src").value;const e=d.querySelector("#dc-err");
   if(!o){e.textContent="Choose an outcome.";e.hidden=false;return}if(n.length<20){e.textContent="Explain the decision in a sentence or two. Both sides see it.";e.hidden=false;return}if(o!=="deny"&&!(amt>0)){e.textContent="Enter the amount.";e.hidden=false;return}
   c.status="closed";c.outcome=o==="deny"?"Denied: "+n:o==="good"?`Goodwill credit ${money(amt)}`:`Paid ${money(amt)} · ${src.split(" (")[0]}`;
   if(o==="pay"&&pp){const row=allRows().find(x=>x.p===c.partner);if(row)row.ded+=CFG.deductible;else{const n=NEG.find(x=>x.p===c.partner);n?n.owed+=CFG.deductible:NEG.push({p:c.partner,owed:CFG.deductible,why:`Deductible for ${c.id}`,at:Date.now()})}}audit(`${c.id} decided: ${c.outcome}`);toast("Decision sent to customer and partner");close();render()}})}

 if(t==="cards")return head+`<div class="note">Each job's virtual card loads with its parts estimate + ${CFG.cardBuf}% and works only at auto parts stores (merchant category locked). It closes when the job is complete. In the live app this runs on a card-issuing service such as Stripe Issuing.</div>

 <p class="muted" style="font-size:13px;margin:0">Parts card spend this week: <b>${money(CARDS.reduce((s,c)=>s+c.spent,0))}</b>. Partners don't front parts money, so there's nothing to reimburse for these jobs.</p>`;

 <div class="tw"><table><thead><tr><th>Invoice</th><th>Fleet</th><th>Run</th><th class="r">Amount</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${INV.map((i,k)=>{const late=Math.round((now-i.due)/D);return `<tr class="click" data-invd="${k}"><td class="num"><b>${i.id}</b></td><td>${esc(i.f)}</td><td>${i.run||"—"}</td><td class="r">${money(i.amt)}</td><td>${fd(i.issued)}</td><td>${fd(i.due)}</td><td>${i.st==="paid"?pill("Paid","ok"):late>0?pill(`${late} days late`,late>30?"bad":"warn"):pill("Open","brand")}</td><td class="r">${i.st==="open"?`<span class="btns">${late>0?`<button class="btn" data-rm="${k}">Send reminder</button>`:""}<button class="btn ok" data-paid="${k}">Mark paid</button></span>`:""}</td></tr>`}).join("")}</tbody></table></div>`};
function fleetBind(m){
 m.querySelectorAll("[data-invd]").forEach(r=>r.onclick=e=>{if(e.target.closest("button"))return;const i=INV[+r.dataset.invd];drawer(`<div class="dh"><h2>${i.id}</h2><button class="x" data-x aria-label="Close">×</button></div><p class="muted" style="margin:0">${esc(i.f)} · run ${i.run||"—"} · issued ${fd(i.issued)} · due ${fd(i.due)}</p><div class="tw"><table><tbody>${i.lines.map(l=>`<tr><td>${esc(l[0])}</td><td class="r">${money(l[1])}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="r"><b>${money(i.amt)}</b></td></tr></tbody></table></div>${i.st==="paid"?pill("Paid","ok"):pill("Open","brand")}`)});

 const num=(attr,key,label)=>m.querySelectorAll(`[data-${attr}]`).forEach(i=>i.onchange=()=>{const v=+i.value;if(!(v>0)){toast("Enter a number above 0");return}const f=FLEETS[+i.dataset[attr]];f[key]=v;audit(`${f.n} ${label} → ${v}`);toast("Saved. Applies to new runs.")});
 num("flab","labor","labor rate");num("fcred","credit","credit limit")}
